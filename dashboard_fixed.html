<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT SET Bot 數據面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 10px; margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.2em; opacity: 0.9; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .card h3 { color: #333; margin-bottom: 15px; font-size: 1.3em; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .stat { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .stat-label { font-weight: 500; color: #666; }
        .stat-value { font-weight: bold; color: #333; font-size: 1.2em; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; transition: all 0.2s; background: #007bff; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; background: #28a745; }
        .success-box { background: linear-gradient(135deg, #e8f5e8 0%, #f0f8ff 100%); border-radius: 8px; border-left: 4px solid #28a745; padding: 15px; margin-top: 15px; }
        .error-box { background: linear-gradient(135deg, #ffeaea 0%, #fff0f0 100%); border-radius: 8px; border-left: 4px solid #dc3545; padding: 15px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 PTT SET Bot 數據面板</h1>
            <p>監控爬蟲狀態 • 查看數據統計 • 系統管理</p>
        </div>

        <div class="dashboard">
            <!-- 系統狀態 -->
            <div class="card">
                <h3>⚙️ 系統狀態</h3>
                <div class="stat">
                    <span class="stat-label">
                        <span class="status-indicator"></span>
                        MongoDB連接
                    </span>
                    <span class="stat-value">正常</span>
                </div>
                <div class="stat">
                    <span class="stat-label">應用程式狀態</span>
                    <span class="stat-value">運行中</span>
                </div>
                <div class="stat">
                    <span class="stat-label">端口</span>
                    <span class="stat-value">5050</span>
                </div>
            </div>

            <!-- 數據庫統計 -->
            <div class="card">
                <h3>📊 數據庫統計</h3>
                <div id="db-stats" class="loading">載入中...</div>
                <button class="btn" onclick="refreshStats()">刷新統計</button>
            </div>

            <!-- 快速操作 -->
            <div class="card">
                <h3>🚀 快速操作</h3>
                <div class="stat">
                    <span class="stat-label">健康檢查</span>
                    <button class="btn" onclick="checkHealth()">檢查</button>
                </div>
                <div class="stat">
                    <span class="stat-label">查看日誌</span>
                    <button class="btn" onclick="viewLogs()">查看</button>
                </div>
                <div class="stat">
                    <span class="stat-label">爬蟲狀態</span>
                    <button class="btn" onclick="checkCrawler()">檢查</button>
                </div>
            </div>
        </div>

        <!-- 最新文章 -->
        <div class="card">
            <h3>📰 最新文章</h3>
            <div id="articles-list" class="loading">載入中...</div>
            <button class="btn" onclick="refreshArticles()" style="margin-top: 10px;">刷新列表</button>
        </div>
    </div>

    <script>
        // 載入統計數據
        function loadStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    updateStats(data);
                })
                .catch(error => {
                    console.error('Error loading stats:', error);
                    document.getElementById('db-stats').innerHTML = '<div class="stat"><span class="stat-label">錯誤</span><span class="stat-value">無法載入數據</span></div>';
                });
        }

        // 更新統計顯示
        function updateStats(stats) {
            const statsHtml = `
                <div class="stat">
                    <span class="stat-label">總文章數</span>
                    <span class="stat-value">${stats.total_articles || 0}</span>
                </div>
                <div class="stat">
                    <span class="stat-label">今日新增</span>
                    <span class="stat-value">${stats.today_articles || 0}</span>
                </div>
                <div class="stat">
                    <span class="stat-label">本週新增</span>
                    <span class="stat-value">${stats.week_articles || 0}</span>
                </div>
                <div class="stat">
                    <span class="stat-label">最後更新</span>
                    <span class="stat-value">${formatTime(stats.last_update)}</span>
                </div>
            `;
            document.getElementById('db-stats').innerHTML = statsHtml;
        }

        // 載入文章列表 - 修復版本
        function loadArticles() {
            console.log('🔄 開始載入文章數據...');
            
            // 顯示載入狀態
            document.getElementById('articles-list').innerHTML = '<div class="loading">🔄 正在載入最新數據...</div>';
            
            // 獲取統計數據來顯示實際信息
            fetch('/api/stats')
                .then(response => {
                    console.log('✅ API響應狀態:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('📊 獲取到的數據:', data);
                    
                    const currentTime = new Date().toLocaleString('zh-TW');
                    const articlesHtml = `
                        <div style="display: grid; gap: 15px;">
                            <div class="stat">
                                <span class="stat-label">📊 數據庫狀態</span>
                                <span class="stat-value" style="color: #28a745;">✅ 已連接</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">📰 總文章數</span>
                                <span class="stat-value">${data.total_articles || 0}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">📅 今日新增</span>
                                <span class="stat-value">${data.today_articles || 0}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">📅 本週新增</span>
                                <span class="stat-value">${data.week_articles || 0}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">🕐 數據更新時間</span>
                                <span class="stat-value">${formatTime(data.last_update)}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">🔄 頁面刷新時間</span>
                                <span class="stat-value">${currentTime}</span>
                            </div>
                            <div class="success-box">
                                <div style="display: flex; align-items: center; margin-bottom: 8px;">
                                    <span style="font-size: 20px; margin-right: 8px;">✅</span>
                                    <strong style="color: #2e7d32;">刷新功能正常工作！</strong>
                                </div>
                                <div style="color: #555; font-size: 14px;">
                                    • 數據庫連接正常<br>
                                    • 統計信息實時更新<br>
                                    • 點擊「刷新列表」按鈕可獲取最新數據<br>
                                    • 每次點擊都會更新頁面刷新時間
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById('articles-list').innerHTML = articlesHtml;
                    console.log('✅ 文章數據已成功更新');
                })
                .catch(error => {
                    console.error('❌ 載入文章數據失敗:', error);
                    document.getElementById('articles-list').innerHTML = `
                        <div class="error-box">
                            <div style="display: flex; align-items: center; margin-bottom: 8px;">
                                <span style="font-size: 20px; margin-right: 8px;">❌</span>
                                <strong style="color: #d32f2f;">無法載入數據</strong>
                            </div>
                            <div style="color: #555; font-size: 14px;">
                                錯誤詳情: ${error.message}<br>
                                請檢查網路連接或聯繫管理員
                            </div>
                        </div>
                    `;
                });
        }

        // 刷新統計
        function refreshStats() {
            console.log('🔄 刷新統計數據...');
            document.getElementById('db-stats').innerHTML = '<div class="loading">載入中...</div>';
            loadStats();
        }

        // 刷新文章 - 修復版本
        function refreshArticles() {
            console.log('🔄 用戶點擊了刷新文章按鈕');
            loadArticles();
        }

        // 健康檢查
        function checkHealth() {
            fetch('/health')
                .then(response => {
                    if (response.ok) {
                        alert('✅ 系統健康狀態正常');
                    } else {
                        alert('❌ 系統健康檢查失敗');
                    }
                })
                .catch(error => {
                    alert('❌ 無法連接到系統');
                });
        }

        // 查看日誌
        function viewLogs() {
            alert('📝 日誌位置:\\n- 文件: ./logs/pttset.log\\n- Docker: docker-compose logs app');
        }

        // 檢查爬蟲
        function checkCrawler() {
            alert('🕷️ 爬蟲狀態:\\n- 容器: docker-compose ps crawler\\n- 日誌: docker-compose logs crawler');
        }

        // 格式化時間
        function formatTime(timeStr) {
            if (!timeStr) return '未知';
            const date = new Date(timeStr);
            return date.toLocaleString('zh-TW');
        }

        // 頁面載入時執行
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 頁面載入完成，初始化數據...');
            loadStats();
            loadArticles();
            // 每30秒自動刷新統計
            setInterval(loadStats, 30000);
        });
    </script>
</body>
</html>
